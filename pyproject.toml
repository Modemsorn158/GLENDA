[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glenda-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<14", "numpy>=1.26", "scikit-learn>=1.5"]

[project.optional-dependencies]
training = ["torch>=2.6", "torchvision>=0.21", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
